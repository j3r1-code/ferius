<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .profile-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #333; }
        p { color: #666; margin-bottom: 20px; }
        .logout-btn { display: inline-block; width: 100%; padding: 10px; background-color: #dc3545; border: none; border-radius: 4px; color: white; font-size: 16px; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .logout-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <div class="profile-card">
        <h2>Добро пожаловать, {{ user.username }}!</h2>
        <p>Вы успешно авторизовались в системе.</p>
        
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="logout-btn">Выйти</button>
        </form>
    </div>
</body>
</html>
