# nginx/nginx.conf

upstream django_backend {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    # Папка с твоим фронтендом
    root /app/frontend;
    index index.html;

    # 1. Главная страница сайта — отдаем твой index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Запросы к API и админке — перенаправляем на Django
    location ~ ^/(api|admin) {
        proxy_pass http://django_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # 3. Статика бэкенда (стили DRF и админки)
    location /static/ {
        alias /app/static/;
    }
}
